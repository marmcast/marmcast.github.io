# Keeps the free Supabase project awake (free projects pause after 7 days with no activity).
# Runs every 3 days. Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/races?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase pinged OK"
