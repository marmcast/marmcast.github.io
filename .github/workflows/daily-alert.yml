# Emails admins once a day (privately, via Gmail) when scores or race suggestions are waiting for review.
# Each admin switches it on or off on the site: footer > My notifications.
# Uses the same secrets as the weekly summary: SUPABASE_URL, SUPABASE_SECRET_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD.
name: Daily review alert

on:
  schedule:
    - cron: "7 7 * * *"     # every day at 07:07 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Email admins if anything is waiting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUMMARY_TO: ${{ secrets.SUMMARY_TO }}
          SITE: https://${{ github.repository_owner }}.github.io
        run: |
          script=$(find . -name 'weekly_digest*.py' -not -path './.git/*' | head -1)
          if [ -z "$script" ]; then
            echo "Can't find weekly_digest.py in the repository. Add it as .github/scripts/weekly_digest.py (see README)."
            exit 1
          fi
          python3 "$script" daily
